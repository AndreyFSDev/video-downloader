[package]
name = "video-downloader"
version = "0.2.0"
description = "Viloader — Boosty and 1000+ sites via yt-dlp"
license = "Apache-2.0"
repository = "https://github.com/AndreyFSDev/Viloader"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
sys-locale = "0.3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "6"
tempfile = "3.27"
boosty_api = "0.32"
reqwest = { version = "0.12", features = ["json"] }
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Portable exe: размер и старт важнее времени сборки.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# Дочерние yt-dlp/ffmpeg сидят в job object с KILL_ON_JOB_CLOSE: при abort ОС
# закрывает хэндлы и гасит их, а копии cookies чистятся на следующем старте.
panic = "abort"


